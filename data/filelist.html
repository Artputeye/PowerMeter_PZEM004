<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#188f82">
  <title>ARTTECH | File Manager</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="filelist.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <div class="brand-mark"><img src="pic/transmission-tower.svg" alt="Power Meter"></div>
      <div>
        <h1>ARTTECH</h1>
        <p class="connection"><span class="status-dot"></span>File manager</p>
      </div>
    </div>
    <nav class="top-navigation" aria-label="Primary navigation">
      <a class="top-navigation-link" href="dashboard.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg></span><span class="nav-label">Dashboard</span></a>
      <a class="top-navigation-link" href="network.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span><span class="nav-label">Network</span></a>
      <a class="top-navigation-link nav-cta" href="setting.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class="nav-label">Setting</span></a>
      <a class="top-navigation-link" href="ota.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M5 13v6h14v-6"/></svg></span><span class="nav-label">OTA</span></a>
      <a class="top-navigation-link" href="console.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.8-4 3-6 6.5-6s5.7 2 6.5 6"/></svg></span><span class="nav-label">Console</span></a>
      <a class="top-navigation-link active" href="filelist.html" aria-current="page"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg></span><span class="nav-label">Files</span></a>
    </nav>
  </header>

  <div class="app-shell">
    <main class="dashboard filelist-page">
      <section class="page-intro">
        <div>
          <p class="overline">LITTLEFS STORAGE</p>
          <h2>File manager</h2>
        </div>
        <div class="date-chip"><span id="fileCount">-- files</span></div>
      </section>

      <section class="panel filelist-panel" aria-labelledby="file-list-title">
        <div class="panel-heading">
          <div>
            <p class="overline">FILESYSTEM</p>
            <h2 id="file-list-title">Stored files</h2>
          </div>
          <button id="refreshButton" class="refresh-button" type="button">REFRESH</button>
        </div>
        <div class="file-table-container">
          <table class="file-table" id="fileTable">
            <thead><tr><th>Type</th><th>Name</th><th class="actions-heading">Size / Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="filelist.js"></script>
</body>
</html>
